<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#ffc400"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#92400e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- pesa negra, inclinada; escalada para quedar dentro de la zona segura del ícono maskable -->
  <g transform="rotate(-16 256 256) translate(256 256) scale(0.94) translate(-256 -256)">
    <g fill="#111113" filter="url(#sh)">
      <!-- placas chicas (afuera) -->
      <rect x="62" y="190" width="44" height="132" rx="18"/>
      <rect x="406" y="190" width="44" height="132" rx="18"/>
      <!-- placas grandes -->
      <rect x="112" y="150" width="52" height="212" rx="24"/>
      <rect x="348" y="150" width="52" height="212" rx="24"/>
      <!-- barra -->
      <rect x="156" y="228" width="200" height="56" rx="28"/>
    </g>
    <!-- brillos -->
    <g fill="#ffffff" opacity="0.22">
      <rect x="124" y="170" width="9" height="66" rx="4.5"/>
      <rect x="360" y="170" width="9" height="66" rx="4.5"/>
      <rect x="170" y="238" width="170" height="8" rx="4"/>
    </g>
  </g>
</svg>
