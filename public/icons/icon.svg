<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#2e1065" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- confeti y destellos -->
  <g fill="#fff">
    <path d="M118 96 l9 24 24 9 -24 9 -9 24 -9 -24 -24 -9 24 -9z"/>
    <path d="M408 372 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" opacity="0.95"/>
    <path d="M300 78 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" opacity="0.9"/>
  </g>
  <circle cx="104" cy="404" r="11" fill="#fde047"/>
  <circle cx="150" cy="430" r="6" fill="#67e8f9"/>
  <circle cx="432" cy="232" r="7" fill="#a3e635"/>

  <!-- pesa con cara, inclinada -->
  <g transform="rotate(-16 256 256)" filter="url(#sh)" stroke="#3b0764" stroke-width="12" stroke-linejoin="round">
    <!-- placas chicas (afuera) -->
    <rect x="62" y="190" width="44" height="132" rx="18" fill="#a3e635"/>
    <rect x="406" y="190" width="44" height="132" rx="18" fill="#a3e635"/>
    <!-- placas grandes -->
    <rect x="102" y="150" width="58" height="212" rx="24" fill="#22d3ee"/>
    <rect x="352" y="150" width="58" height="212" rx="24" fill="#facc15"/>
    <!-- mango -->
    <rect x="156" y="216" width="200" height="80" rx="40" fill="#fff7ed"/>
  </g>

  <g transform="rotate(-16 256 256)">
    <!-- brillos de las placas -->
    <g fill="#fff" opacity="0.6">
      <rect x="116" y="170" width="10" height="70" rx="5"/>
      <rect x="366" y="170" width="10" height="70" rx="5"/>
    </g>
    <!-- cara -->
    <g fill="#3b0764">
      <ellipse cx="228" cy="252" rx="9" ry="11"/>
      <ellipse cx="284" cy="252" rx="9" ry="11"/>
    </g>
    <circle cx="224" cy="248" r="3" fill="#fff"/>
    <circle cx="280" cy="248" r="3" fill="#fff"/>
    <path d="M232 268 Q256 292 280 268" fill="none" stroke="#3b0764" stroke-width="9" stroke-linecap="round"/>
    <circle cx="204" cy="270" r="10" fill="#fb7185" opacity="0.75"/>
    <circle cx="308" cy="270" r="10" fill="#fb7185" opacity="0.75"/>
  </g>
</svg>
